# Целевые доли портфеля для `report.py deploy <сумма>`. Скопируй в ~/.tinvest/targets.yaml и поправь под себя.
# Веса групп — в процентах от всего портфеля (в сумме 100). Веса бумаг — внутри группы (в сумме 100).
# Бумаги в портфеле, которых здесь нет, считаются «вне целей»: их не продаём и не докупаем.
# Тикеры — как на Мосбирже; для облигаций можно ISIN (RU000A…) или код ОФЗ (SU26238RMFS4).

cash_reserve: 0          # сколько рублей из взноса оставить деньгами

groups:
  - name: Акции РФ
    weight: 50
    items:
      - {ticker: SBMX, weight: 100}        # фонд на индекс Мосбиржи; можно разложить на отдельные акции

  - name: Облигации
    weight: 35
    items:
      - {ticker: SU26238RMFS4, weight: 50} # длинная ОФЗ с фиксированным купоном
      - {ticker: SU29014RMFS6, weight: 50} # ОФЗ-флоатер (пример; подставь свои выпуски)

  - name: Золото
    weight: 10
    items:
      - {ticker: GLDRUB_TOM, weight: 100}  # биржевое золото; альтернатива — фонд TGLD

  - name: Денежный рынок
    weight: 5
    items:
      - {ticker: LQDT, weight: 100}
