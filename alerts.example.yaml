# Пороги для brief.py. Скопируй в ~/.tinvest/alerts.yaml и поправь под себя.
offer_days: 30        # предупреждать об оферте, если до неё меньше N дней
payouts_days: 7       # показывать купоны/дивиденды/погашения на N дней вперёд
move_pct: 7           # алерт, если позиция изменилась больше чем на N% с прошлого брифа
portfolio_move_pct: 2 # алерт, если весь портфель изменился больше чем на N% за день
cash_min: 0           # алерт, если свободных рублей меньше N (0 — выключено)
